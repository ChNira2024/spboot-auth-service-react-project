server {
  listen 80;

  server_name localhost;

  # React build files
  root /usr/share/nginx/html;
  index index.html;

  # ✅ Fix React Router refresh issue
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 🔥 OPTIONAL: API routing (recommended for microservices)

  location /api/auth/ {
    proxy_pass http://auth-service:8085/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/hello/ {
    proxy_pass http://hello-service:8086/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}